<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="#1a1a2e"/>

  <!-- Scissors icon centered -->
  <!-- Top blade -->
  <g transform="translate(32,32) rotate(-30)">
    <circle cx="-10" cy="-6" r="5" stroke="#e2c27d" stroke-width="2.5" fill="none"/>
    <line x1="-5.5" y1="-4" x2="14" y2="2" stroke="#e2c27d" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <!-- Bottom blade -->
  <g transform="translate(32,32) rotate(30) scale(1,-1)">
    <circle cx="-10" cy="-6" r="5" stroke="#e2c27d" stroke-width="2.5" fill="none"/>
    <line x1="-5.5" y1="-4" x2="14" y2="2" stroke="#e2c27d" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
